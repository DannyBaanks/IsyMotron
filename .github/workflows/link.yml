name: Link gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'core/isymotron/link/**'
      - 'tools/link_cli.py'
      - 'tests/test_link_*.py'
      - '.github/workflows/link.yml'
  push:
    branches: [master]
    paths:
      - 'core/isymotron/link/**'
      - 'tools/link_cli.py'
      - 'tests/test_link_*.py'
      - '.github/workflows/link.yml'

permissions:
  contents: read

jobs:
  python-link:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==9.1.1
      - name: Link server, CLI and regression gates
        run: python -m pytest -q tests/test_link_server.py tests/test_link_cli.py tests/test_link_regressions.py
