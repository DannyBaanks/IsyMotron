# CI for a Windows-first product that also builds on Linux and macOS.
#
# Windows remains the reference: the real host gate exercises actual NTFS,
# junctions and process state. Linux and macOS run the same suite so the core
# (contract, policy, receipts, Quine Gate, codec) is proven portable, and build
# a binary so the artifact substrate is too. A green Linux/macOS job proves
# the CORE and the BUILD, not a host: those platforms have no real host
# backend yet and the smoke receipt records NOT_DEMONSTRATED for them
# (docs/PLATFORM_SUPPORT.md).
#
# Two jobs, each a three-OS matrix:
#   gates   -- the acceptance suite. The live-model gate self-skips when no
#             provider key is present, so CI is green without secrets and
#             richer with them (NVIDIA_NIM_API_KEY / NEBIUS_API_KEY).
#   binary  -- build the binary from a clean machine and run its self-smoke
#             (serves /api/state, 401 without the token, bundled data, help,
#             stops cleanly, real-host vs fixture recorded in a receipt).

name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pytest + pillow (the PNG test oracle). The runtime itself is
      # stdlib-only; test_runtime_imports_no_third_party_package enforces it.
      - run: python -m pip install -r requirements-dev.txt
      - name: The acceptance suite
        run: python -m pytest -q -rs
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          ISYMOTRON_PROVIDER: ${{ vars.ISYMOTRON_PROVIDER || 'nvidia' }}

      - name: The CLI boots, reaches evidence, and refuses unknown commands (Windows)
        if: runner.os == 'Windows'
        # Also re-proves on a real Windows checkout that sealed evidence hashes
        # still match: this is the check a CRLF checkout broke once.
        #
        # `exit 0` at the end on purpose: the pwsh wrapper GitHub runs ends with
        # `exit $LASTEXITCODE`, so the step would otherwise inherit the 2 from
        # the deliberate refusals below and go red after passing every check.
        run: |
          python tools/isymotron_cli.py help
          python tools/isymotron_cli.py where
          python tools/isymotron_cli.py --version
          python tools/isymotron_cli.py evidence verify evidence/M3/hashes.json
          python tools/isymotron_cli.py zzz
          if ($LASTEXITCODE -ne 2) { throw "expected exit 2 from an unknown command" }
          python tools/isymotron_cli.py process verify 1 --baseline missing.json
          if ($LASTEXITCODE -ne 2) { throw "expected exit 2 from a missing baseline" }
          exit 0

      - name: The CLI boots, reaches evidence, and refuses unknown commands (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -u
          python tools/isymotron_cli.py help >/dev/null
          python tools/isymotron_cli.py where
          python tools/isymotron_cli.py --version
          python tools/isymotron_cli.py evidence verify evidence/M3/hashes.json
          set +e
          python tools/isymotron_cli.py zzz; rc=$?
          [ "$rc" -eq 2 ] || { echo "expected exit 2 from an unknown command, got $rc"; exit 1; }
          python tools/isymotron_cli.py process verify 1 --baseline missing.json; rc=$?
          [ "$rc" -eq 2 ] || { echo "expected exit 2 from a missing baseline, got $rc"; exit 1; }
          exit 0

  binary:
    name: binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04, not -latest: a PyInstaller binary needs a glibc at least
        # as new as the builder's, so the older builder runs on more systems.
        os: [windows-latest, ubuntu-22.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - name: Build the binary and smoke it
        run: python build_exe.py
      - name: Upload the smoke receipt
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}
          path: dist/smoke-*.json
          if-no-files-found: error
