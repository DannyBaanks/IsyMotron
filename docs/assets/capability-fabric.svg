<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">ISyMotron capability fabric</title>
  <desc id="desc">The current contract exposes filesystem, process, apps and system capabilities through a relay to a real Windows host and simulator fixture.</desc>
  <rect width="1000" height="430" rx="26" fill="#111719"/>
  <g font-family="Inter,Segoe UI,sans-serif" text-anchor="middle"><text x="500" y="42" fill="#f3f7ef" font-size="22" font-weight="700">The capability fabric</text><text x="500" y="67" fill="#9aac9e" font-size="13">Capabilities are explicit, bounded and host-owned.</text>
  <g fill="none" stroke="#76b900" stroke-width="3"><path d="M500 115V150"/><path d="M500 150L185 215M500 150L390 215M500 150L610 215M500 150L815 215"/><path d="M185 275V330M390 275V330M610 275V330M815 275V330"/></g>
  <rect x="380" y="85" width="240" height="55" rx="14" fill="#23352a" stroke="#a9e65d"/><text x="500" y="119" fill="#efffe0" font-size="17" font-weight="700">ISyMotron contract</text>
  <g>
  <rect x="90" y="215" width="190" height="60" rx="14" fill="#1a2625" stroke="#76b900"/><text x="185" y="241" fill="#fff" font-size="16" font-weight="700">filesystem</text><text x="185" y="260" fill="#9aac9e" font-size="11">read · write · scoped roots</text>
  <rect x="295" y="215" width="190" height="60" rx="14" fill="#1a2625" stroke="#76b900"/><text x="390" y="241" fill="#fff" font-size="16" font-weight="700">process</text><text x="390" y="260" fill="#9aac9e" font-size="11">inspect · read-only</text>
  <rect x="515" y="215" width="190" height="60" rx="14" fill="#1a2625" stroke="#76b900"/><text x="610" y="241" fill="#fff" font-size="16" font-weight="700">apps</text><text x="610" y="260" fill="#9aac9e" font-size="11">launch · allowlist</text>
  <rect x="720" y="215" width="190" height="60" rx="14" fill="#1a2625" stroke="#76b900"/><text x="815" y="241" fill="#fff" font-size="16" font-weight="700">system</text><text x="815" y="260" fill="#9aac9e" font-size="11">info · non-identifying facts</text>
  </g>
  <rect x="110" y="330" width="350" height="50" rx="13" fill="#223326" stroke="#d8ff9a"/><text x="285" y="361" fill="#efffe0" font-size="16" font-weight="700">Real Windows host · demonstrated</text>
  <rect x="540" y="330" width="350" height="50" rx="13" fill="#20272a" stroke="#8b9890" stroke-dasharray="7 5"/><text x="715" y="361" fill="#c1ccc3" font-size="16" font-weight="700">Linux / other hosts · not product target</text>
  </g>
</svg>
