<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">ISyMotron architecture</title>
  <desc id="desc">A proposal flows from a model through capability resolution and a relay to heterogeneous hosts, where local policy decides and execution produces a sealed receipt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#111719"/><stop offset="1" stop-color="#17221d"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#76b900"/><stop offset="1" stop-color="#d8ff9a"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9bce51"/></marker>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <g fill="none" stroke="#26382c" opacity=".65"><path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200"/><path d="M120 0V560M240 0V560M360 0V560M480 0V560M600 0V560M720 0V560M840 0V560M960 0V560M1080 0V560"/></g>
  <g font-family="Inter,Segoe UI,sans-serif" text-anchor="middle">
    <text x="600" y="42" fill="#f3f7ef" font-size="22" font-weight="700">One AI. Many hosts. Local authority.</text>
    <text x="600" y="68" fill="#9aac9e" font-size="13">The model proposes; the host decides; the receipt records.</text>
    <g stroke="url(#line)" stroke-width="3" marker-end="url(#arrow)" filter="url(#glow)"><path d="M190 252H250"/><path d="M390 252H450"/><path d="M590 252H650"/><path d="M790 252H850"/><path d="M985 252H1040"/></g>
    <g>
      <rect x="55" y="190" width="135" height="125" rx="18" fill="#1a2625" stroke="#76b900"/>
      <circle cx="122" cy="235" r="25" fill="#76b900" opacity=".2" stroke="#a9e65d"/><circle cx="110" cy="227" r="5" fill="#d8ff9a"/><circle cx="133" cy="245" r="5" fill="#d8ff9a"/><path d="M110 227L133 245" stroke="#d8ff9a" stroke-width="2"/>
      <text x="122" y="290" fill="#fff" font-size="16" font-weight="700">User / AI</text><text x="122" y="306" fill="#9aac9e" font-size="11">intent</text>
    </g>
    <g>
      <rect x="250" y="190" width="140" height="125" rx="18" fill="#1a2625" stroke="#76b900"/>
      <path d="M278 232h84M278 251h62M278 270h75" stroke="#b9d98e" stroke-width="7" stroke-linecap="round" opacity=".8"/>
      <text x="320" y="290" fill="#fff" font-size="16" font-weight="700">Planner</text><text x="320" y="306" fill="#9aac9e" font-size="11">Nemotron / provider</text>
    </g>
    <g>
      <rect x="450" y="190" width="140" height="125" rx="18" fill="#1a2625" stroke="#76b900"/>
      <path d="M492 225l28-14 28 14-28 14zM492 248l28 14 28-14M520 239v23" fill="none" stroke="#d8ff9a" stroke-width="3"/>
      <text x="520" y="290" fill="#fff" font-size="16" font-weight="700">Resolver</text><text x="520" y="306" fill="#9aac9e" font-size="11">explicit capabilities</text>
    </g>
    <g>
      <rect x="650" y="190" width="140" height="125" rx="18" fill="#1a2625" stroke="#76b900"/>
      <path d="M680 232h80M680 252h80M680 272h80" stroke="#d8ff9a" stroke-width="3"/><circle cx="690" cy="232" r="5" fill="#76b900"/><circle cx="690" cy="252" r="5" fill="#76b900"/><circle cx="690" cy="272" r="5" fill="#76b900"/>
      <text x="720" y="290" fill="#fff" font-size="16" font-weight="700">Relay</text><text x="720" y="306" fill="#9aac9e" font-size="11">transport only</text>
    </g>
    <g>
      <rect x="850" y="150" width="135" height="205" rx="18" fill="#1a2625" stroke="#76b900"/>
      <text x="918" y="181" fill="#fff" font-size="16" font-weight="700">Hosts</text>
      <rect x="875" y="198" width="85" height="35" rx="9" fill="#25342b"/><text x="918" y="221" fill="#d8ff9a" font-size="12">Windows</text>
      <rect x="875" y="244" width="85" height="35" rx="9" fill="#25342b"/><text x="918" y="267" fill="#d8ff9a" font-size="12">Simulator</text>
      <rect x="875" y="290" width="85" height="35" rx="9" fill="#25342b" stroke-dasharray="5 4"/><text x="918" y="313" fill="#9aac9e" font-size="12">future</text>
      <text x="918" y="340" fill="#9aac9e" font-size="10">each host enforces</text>
    </g>
    <g>
      <rect x="1040" y="190" width="125" height="125" rx="18" fill="#223326" stroke="#d8ff9a"/>
      <path d="M1102 216l25 10v22c0 18-12 30-25 36-13-6-25-18-25-36v-22z" fill="#76b900" opacity=".7" stroke="#eaffc9" stroke-width="2"/><path d="M1089 249l9 9 18-20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1102" y="303" fill="#fff" font-size="15" font-weight="700">Receipt</text><text x="1102" y="319" fill="#c9e9ae" font-size="10">sealed evidence</text>
    </g>
    <text x="122" y="390" fill="#9aac9e" font-size="12">proposes</text><text x="320" y="390" fill="#9aac9e" font-size="12">plans</text><text x="520" y="390" fill="#9aac9e" font-size="12">names bounds</text><text x="720" y="390" fill="#9aac9e" font-size="12">carries</text><text x="918" y="390" fill="#9aac9e" font-size="12">decides locally</text><text x="1102" y="390" fill="#d8ff9a" font-size="12">proves outcome</text>
  </g>
</svg>
