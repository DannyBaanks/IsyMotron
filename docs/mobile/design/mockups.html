<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IsyMotron Móvil · propuestas de UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* Two proposals, same screens and content. Inspired by, not copying: no third-party logos or marks. */
:root { --phone-w: 390px; --phone-h: 844px; }
* { box-sizing: border-box; }
body { margin: 0; padding: 48px; background: #e9ebef; font-family: Inter, system-ui, sans-serif; }
.board-title { font: 800 34px/1.1 Inter, sans-serif; margin: 0 0 6px; color: #111; }
.board-sub { margin: 0 0 32px; color: #555; font-size: 16px; }
.grid { display: grid; grid-template-columns: repeat(3, var(--phone-w)); gap: 40px 36px; }
.cell figcaption { margin: 12px 4px 0; font: 600 15px Inter, sans-serif; color: #222; }
.cell figcaption span { display: block; font-weight: 400; color: #666; font-size: 13px; margin-top: 2px; }
figure { margin: 0; }

.phone { width: var(--phone-w); height: var(--phone-h); border-radius: 44px; overflow: hidden; position: relative; background: var(--bg); color: var(--text); box-shadow: 0 30px 60px -20px rgba(0,0,0,.45), 0 0 0 10px #111, 0 0 0 11px #333; font-family: var(--font); display: flex; flex-direction: column; }
.status { height: 50px; flex: none; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 8px; font: 600 15px var(--font); color: var(--text); }
.status .icons { display: flex; gap: 6px; align-items: center; }
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; border-radius: 20px; background: #000; z-index: 5; }
.content { flex: 1; overflow: hidden; padding: 6px 20px 0; display: flex; flex-direction: column; gap: 14px; }
.nav { flex: none; height: 82px; display: grid; grid-template-columns: repeat(4, 1fr); padding: 8px 10px 26px; border-top: 1px solid var(--line); background: var(--nav); }
.nav div { display: flex; flex-direction: column; align-items: center; gap: 4px; font: 600 11px var(--font); color: var(--muted); }
.nav div.on { color: var(--accent); }
.nav svg { width: 22px; height: 22px; }
.mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
svg { display: block; }

.appbar { display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 10px; font: 800 18px var(--font); letter-spacing: var(--brand-ls); text-transform: var(--brand-tt); }
.mark { width: 30px; height: 30px; }
.iconbtn { width: 38px; height: 38px; border-radius: var(--r-sm); border: 1px solid var(--line); display: grid; place-items: center; color: var(--text); background: var(--surface); }
.back { display: flex; align-items: center; gap: 6px; color: var(--muted); font: 600 14px var(--font); }
.eyebrow { font: 700 11px var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0; font: 800 var(--h1) var(--font); letter-spacing: var(--h-ls); }
h2 { margin: 0; font: 700 17px var(--font); }
.lead { margin: 0; color: var(--muted); font-size: 14.5px; line-height: 1.45; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.hero { background: var(--hero); border: 1px solid var(--hero-line); border-radius: var(--r); padding: 18px; position: relative; overflow: hidden; }
.flow { display: flex; align-items: center; gap: 8px; margin-top: 12px; font: 600 12px var(--font); color: var(--text); }
.flow span { padding: 6px 9px; border-radius: var(--r-xs); background: var(--chip); border: 1px solid var(--line); }
.flow i { color: var(--accent); font-style: normal; }
.row { display: flex; align-items: center; gap: 12px; }
.sp { flex: 1; }
.pc { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.pc .ico { width: 42px; height: 42px; border-radius: var(--r-sm); display: grid; place-items: center; background: var(--chip); color: var(--accent); flex: none; }
.pc b { display: block; font-size: 15px; }
.pc small { color: var(--muted); font-size: 12.5px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: 1px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font: 700 11.5px var(--font); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.off { background: var(--chip); color: var(--muted); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.btn { height: 54px; border-radius: var(--r-btn); display: flex; align-items: center; justify-content: center; gap: 8px; font: 700 16px var(--font); border: 1px solid var(--line); background: var(--surface); color: var(--text); letter-spacing: var(--btn-ls); text-transform: var(--btn-tt); }
.btn.primary { background: var(--cta); color: var(--cta-text); border-color: transparent; box-shadow: var(--cta-glow); }
.btn.ghost { background: transparent; }
.label { font: 700 11px var(--font); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.cmd { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--code-bg); border: 1px solid var(--line); font: 600 13.5px "JetBrains Mono", monospace; color: var(--code); }
.cmd .p { color: var(--accent); }
.cmd svg { margin-left: auto; color: var(--muted); }
.input { height: 54px; border-radius: var(--r-sm); border: 1.5px solid var(--accent); background: var(--input); display: flex; align-items: center; padding: 0 14px; font: 600 17px "JetBrains Mono", monospace; color: var(--text); box-shadow: var(--focus); }
.input .caret { width: 2px; height: 22px; background: var(--accent); margin-left: 2px; }
.input.field { border-color: var(--line); box-shadow: none; font: 500 15px var(--font); color: var(--muted); }
.input.area { height: 84px; align-items: flex-start; padding-top: 14px; }
.steps { display: flex; gap: 6px; }
.steps div { flex: 1; height: 4px; border-radius: 4px; background: var(--line); }
.steps div.on { background: var(--accent); }
.stepnames { display: flex; justify-content: space-between; font: 600 11.5px var(--font); color: var(--muted); }
.stepnames .on { color: var(--text); }
.n { width: 26px; height: 26px; border-radius: var(--r-n); background: var(--accent); color: var(--cta-text); display: grid; place-items: center; font: 800 13px var(--font); flex: none; }
.n.dim { background: var(--chip); color: var(--muted); }
.tip { display: flex; gap: 10px; padding: 12px; border-radius: var(--r-sm); background: var(--chip); color: var(--muted); font-size: 13px; line-height: 1.4; }
.tip svg { flex: none; color: var(--accent); }
.codebox { display: flex; justify-content: center; gap: 8px; }
.codebox div { width: 46px; height: 62px; border-radius: var(--r-sm); background: var(--code-bg); border: 1.5px solid var(--code-line); display: grid; place-items: center; font: 700 32px "JetBrains Mono", monospace; color: var(--accent); }
.codebox .gap { width: 10px; border: 0; background: none; }
.timer { text-align: center; color: var(--muted); font-size: 13px; }
.warnbox { display: flex; gap: 10px; padding: 12px; border-radius: var(--r-sm); background: var(--warn-bg); color: var(--warn); font-size: 13px; line-height: 1.4; }
.task { padding: 13px 14px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.task b { font-size: 14.5px; display: block; }
.task small { color: var(--muted); font-size: 12px; }
.tl { display: flex; flex-direction: column; }
.tl .it { display: flex; gap: 12px; position: relative; padding-bottom: 16px; }
.tl .it::before { content: ""; position: absolute; left: 15px; top: 34px; bottom: 0; width: 2px; background: var(--line); }
.tl .it:last-child::before { display: none; }
.tl .ic { width: 32px; height: 32px; border-radius: var(--r-n); display: grid; place-items: center; background: var(--chip); color: var(--accent); flex: none; border: 1px solid var(--line); }
.tl b { font-size: 14.5px; }
.tl small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.sig { color: var(--ok); font-weight: 600; }
.checks { display: grid; gap: 10px; }
.checks div { display: flex; align-items: center; gap: 10px; font-size: 14.5px; }
.checks svg { color: var(--ok); }
.fp { font: 700 20px "JetBrains Mono", monospace; letter-spacing: .06em; color: var(--accent); }
.seg { display: flex; padding: 4px; border-radius: var(--r-sm); background: var(--chip); gap: 4px; }
.seg div { flex: 1; text-align: center; padding: 8px 0; border-radius: var(--r-xs); font: 700 12.5px var(--font); color: var(--muted); }
.seg .on { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
.danger { color: var(--danger); border-color: var(--danger-line) !important; }
.glow { position: absolute; border-radius: 50%; filter: blur(50px); pointer-events: none; }

/* ---------- A · Verde terminal (inspired by NVIDIA) ---------- */
.a { --bg: #050505; --surface: #121212; --line: #262626; --text: #f5f5f5; --muted: #8c8c8c; --accent: #76b900; --nav: #0a0a0a;
  --chip: #1b1b1b; --hero: linear-gradient(135deg, #0f1a00, #121212 60%); --hero-line: #2d4500; --code-bg: #0c0c0c; --code: #e8e8e8; --code-line: #355400;
  --input: #0c0c0c; --focus: 0 0 0 3px rgba(118,185,0,.18); --cta: #76b900; --cta-text: #000; --cta-glow: none;
  --ok: #8fd400; --ok-bg: rgba(118,185,0,.14); --warn: #ffb020; --warn-bg: rgba(255,176,32,.1); --danger: #ff5c5c; --danger-line: #4a1d1d;
  --r: 6px; --r-sm: 4px; --r-xs: 3px; --r-btn: 4px; --r-n: 3px;
  --font: Inter, system-ui, sans-serif; --h1: 27px/1.12; --h-ls: -.01em; --brand-ls: .12em; --brand-tt: uppercase; --btn-ls: .04em; --btn-tt: uppercase; }
.a .content { background-image: linear-gradient(rgba(118,185,0,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(118,185,0,.035) 1px, transparent 1px); background-size: 28px 28px; }
.a .phone::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: #76b900; }
.a .btn { font-size: 14.5px; }
.a .card, .a .pc, .a .task { border-left: 2px solid var(--line); }
.a .pc.on { border-left-color: #76b900; }

/* ---------- B · Nube (inspired by Nebius) ---------- */
.b { --bg: #070b24; --surface: rgba(255,255,255,.05); --line: rgba(255,255,255,.1); --text: #f2f4ff; --muted: #9aa3c7; --accent: #d6ff4b; --nav: rgba(7,11,36,.92);
  --chip: rgba(255,255,255,.07); --hero: linear-gradient(140deg, rgba(139,124,255,.35), rgba(214,255,75,.12)); --hero-line: rgba(255,255,255,.12); --code-bg: rgba(0,0,0,.28); --code: #e6e9ff; --code-line: rgba(214,255,75,.35);
  --input: rgba(0,0,0,.25); --focus: 0 0 0 4px rgba(214,255,75,.15); --cta: linear-gradient(135deg, #d6ff4b, #b4f03c); --cta-text: #0b0f2a; --cta-glow: 0 10px 30px -8px rgba(214,255,75,.5);
  --ok: #b7f36a; --ok-bg: rgba(183,243,106,.13); --warn: #ffc56b; --warn-bg: rgba(255,197,107,.1); --danger: #ff8a9a; --danger-line: rgba(255,138,154,.3);
  --r: 22px; --r-sm: 16px; --r-xs: 12px; --r-btn: 999px; --r-n: 50%;
  --font: Manrope, system-ui, sans-serif; --h1: 30px/1.1; --h-ls: -.02em; --brand-ls: -.01em; --brand-tt: none; --btn-ls: 0; --btn-tt: none; }
.b .phone { background: radial-gradient(120% 60% at 100% 0%, rgba(139,124,255,.28), transparent 60%), radial-gradient(90% 50% at 0% 100%, rgba(214,255,75,.08), transparent 60%), #070b24; }
.b .card, .b .pc, .b .task { backdrop-filter: blur(8px); }
.b .eyebrow { color: #b9b0ff; }
</style>
</head>
<body>
<h1 class="board-title" id="title"></h1>
<p class="board-sub" id="sub"></p>
<div class="grid" id="grid"></div>

<script>
const theme = (location.hash.slice(1) || "a");
document.body.className = theme;
const T = {
  a: ["Propuesta A · Verde terminal", "Inspirada en NVIDIA: negro profundo, verde intenso, esquinas rectas, rejilla técnica y mayúsculas. Sensación de consola de control."],
  b: ["Propuesta B · Nube", "Inspirada en Nebius: azul profundo con brillo violeta, lima como acento, tarjetas de vidrio redondeadas y botones píldora. Más amable y aireada."],
}[theme];
document.getElementById("title").textContent = T[0];
document.getElementById("sub").textContent = T[1];

const I = {
  mark: `<svg class="mark" viewBox="0 0 32 32"><path d="M16 2 28 9v14l-12 7L4 23V9z" fill="none" stroke="var(--accent)" stroke-width="2.4"/><path d="M16 9v14M11 12l5-3 5 3M11 20l5 3 5-3" stroke="var(--accent)" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>`,
  home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>`,
  tasks: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>`,
  receipt: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>`,
  phone: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg>`,
  pc: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>`,
  laptop: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="10" rx="1.5"/><path d="M2 19h20"/></svg>`,
  plus: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>`,
  copy: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg>`,
  wifi: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 9a15 15 0 0 1 20 0M5 13a10 10 0 0 1 14 0M8.5 16.5a5 5 0 0 1 7 0M12 20h.01"/></svg>`,
  shield: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/></svg>`,
  check: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m5 12 5 5 9-10"/></svg>`,
  link: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/></svg>`,
  send: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12 20 4l-6 16-3-7z"/></svg>`,
  x: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6 6 18"/></svg>`,
  chev: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 6 6 6-6 6"/></svg>`,
  backi: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 6-6 6 6 6"/></svg>`,
  bell: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg>`,
  key: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3"/></svg>`,
};
const status = `<div class="island"></div><div class="status"><span>9:41</span><span class="icons"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/></svg></span></div>`;
const nav = (on) => `<div class="nav">${[["home","Inicio"],["tasks","Tareas"],["receipt","Recibos"],["phone","Teléfono"]].map(([k,l],i)=>`<div class="${i===on?"on":""}">${I[k]}${l}</div>`).join("")}</div>`;
const glow = theme === "b" ? `<div class="glow" style="width:180px;height:180px;right:-60px;top:-60px;background:rgba(214,255,75,.25)"></div>` : "";

const screens = [
  ["Inicio", "Tus PCs de un vistazo, cuál está en línea y su última tarea. Botón grande para enlazar otra.", `
    <div class="appbar"><div class="brand">${I.mark}IsyMotron</div><div class="iconbtn">${I.bell}</div></div>
    <div class="hero">${glow}<div class="eyebrow">Autoridad local</div><h1 style="margin-top:6px">Tu teléfono pide.<br>Tu PC decide.</h1>
      <div class="flow"><span>Modelo propone</span><i>→</i><span>PC decide</span><i>→</i><span>Recibo</span></div></div>
    <div class="row"><h2>Mis PCs</h2><span class="sp"></span><span class="pill ok"><span class="dot" style="background:var(--ok);margin:0"></span>1 en línea</span></div>
    <div class="pc on"><div class="ico">${I.pc}</div><div><b>isytron-escritorio</b><small><span class="dot" style="background:var(--ok)"></span>En línea · Revisar el respaldo</small></div><span class="sp"></span><span style="color:var(--muted)">${I.chev}</span></div>
    <div class="pc"><div class="ico" style="color:var(--muted)">${I.laptop}</div><div><b>isytron-laptop</b><small><span class="dot" style="background:var(--muted)"></span>Sin conexión · hace 2 h</small></div><span class="sp"></span><span style="color:var(--muted)">${I.chev}</span></div>
    <div class="btn primary">${I.plus}Enlazar otra PC</div>
    <div class="tip">${I.shield}<div>Todo va firmado y cifrado con la criptografía de este teléfono. Solo cree respuestas firmadas por tus PCs.</div></div>
  `, 0],
  ["Enlazar · paso 2 de 3", "Pasos claros con barra de progreso. El comando se copia con un toque y la dirección se escribe en grande.", `
    <div class="appbar"><div class="back">${I.backi}Inicio</div><div class="mono" style="color:var(--muted);font-size:12px">PASO 2/3</div></div>
    <div class="steps"><div class="on"></div><div class="on"></div><div></div></div>
    <div class="stepnames"><span class="on">Prender Link</span><span class="on">Dirección</span><span>Código</span></div>
    <div><div class="eyebrow">Enlazar con mi PC</div><h1 style="margin-top:6px">¿Dónde está tu PC?</h1></div>
    <div class="row" style="align-items:flex-start"><div class="n">1</div><div style="flex:1"><div style="font-weight:600;margin-bottom:8px">En tu PC corre</div><div class="cmd"><span class="p">$</span>isymotron link servir --red${I.copy}</div></div></div>
    <div class="row" style="align-items:flex-start"><div class="n">2</div><div style="flex:1"><div style="font-weight:600;margin-bottom:8px">Escribe la dirección que te muestra</div><div class="input">192.168.1.20:47931<span class="caret"></span></div></div></div>
    <div class="tip">${I.wifi}<div>El teléfono y la PC tienen que estar en la <b style="color:var(--text)">misma Wi-Fi</b>. Si Windows pregunta por el firewall, permite redes privadas.</div></div>
    <span class="sp"></span>
    <div class="btn primary" style="margin-bottom:22px">Buscar mi PC ${I.chev}</div>
  `, -1],
  ["Enlazar · el código", "El código en cajas grandes, fácil de leer en voz alta. Tiempo restante visible y una advertencia clara.", `
    <div class="appbar"><div class="back">${I.backi}Dirección</div><div class="mono" style="color:var(--muted);font-size:12px">PASO 3/3</div></div>
    <div class="steps"><div class="on"></div><div class="on"></div><div class="on"></div></div>
    <div class="card" style="display:flex;gap:12px;align-items:center"><div class="pc" style="padding:0;border:0;background:none"><div class="ico">${I.pc}</div></div><div><b>isytron-escritorio</b><div class="mono" style="color:var(--muted);font-size:12.5px;margin-top:2px">huella dff6 e8ad 31b7 32da</div></div></div>
    <div style="text-align:center"><div class="label">Escribe este código en tu PC</div></div>
    <div class="codebox"><div>1</div><div>8</div><div>7</div><div class="gap"></div><div>3</div><div>2</div><div>7</div></div>
    <div class="timer">Vence en <b class="mono" style="color:var(--text)">9:41</b></div>
    <div class="cmd"><span class="p">$</span>isymotron link aceptar 187327${I.copy}</div>
