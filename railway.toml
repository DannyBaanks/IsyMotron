# Railway deployment config
# https://docs.railway.app/reference/railway-toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.deploy"

[deploy]
# "/" serves index.html WITHOUT auth (the API routes 401 without a session
# token). Healthchecking /api/state would look like a dead app -> 502.
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Optional: set to use a specific port (Railway provides PORT env var)
# [env]
# PORT = "8760"